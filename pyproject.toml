[project]
name = "scilab-control-plane"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk[fastapi]==1.1.5",
    "fastapi>=0.115,<0.130",
    "fastmcp==3.4.0",
    "opensandbox==1.1.0",
    "opentelemetry-api>=1,<2",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "openapi-spec-validator>=0.7,<1",
    "pyyaml>=6,<7",
    "pytest>=8,<9",
    "rfc3339-validator>=0.1,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/control-plane/src"]
