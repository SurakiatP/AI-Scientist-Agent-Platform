apiVersion: v1
kind: ConfigMap
metadata:
  name: scilab-opensandbox-config
  labels:
    app.kubernetes.io/name: opensandbox
    app.kubernetes.io/part-of: scilab
data:
  release: "release-1.1.0"
  packageVersion: "1.1.0"
  sandbox.toml: |
    [runtime]
    type = "kubernetes"
    execd_image = "opensandbox/execd:release-1.1.0@sha256:{{ include "scilab.digest" (dict "path" "images.openSandbox.execd" "digest" .Values.images.openSandbox.execd.digest) }}"

    [secure_runtime]
    type = "kata"
    k8s_runtime_class = "kata-qemu"

    [egress]
    mode = "dns+nft"
    image = "opensandbox/egress:release-1.1.0@sha256:{{ include "scilab.digest" (dict "path" "images.openSandbox.egress" "digest" .Values.images.openSandbox.egress.digest) }}"
  sandbox-request-defaults.yaml: |
    credentialProxy:
      enabled: true
    networkPolicy:
      defaultAction: deny
      allowedHosts: []
      dns:
        mode: dns+nft
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
handler: kata-qemu
