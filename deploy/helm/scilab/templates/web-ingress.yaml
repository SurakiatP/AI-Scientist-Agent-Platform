{{- if .Values.web.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: scilab
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  {{- with .Values.web.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ required "web.ingress.host is required when enabled" .Values.web.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web-service
                port:
                  number: {{ .Values.web.port }}
  tls:
    - hosts:
        - {{ .Values.web.ingress.host | quote }}
      secretName: {{ required "web.ingress.tlsSecretName is required when enabled" .Values.web.ingress.tlsSecretName | quote }}
{{- end }}
