apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: labs.scilab.ai
spec:
  group: scilab.ai
  scope: Namespaced
  names:
    plural: labs
    singular: lab
    kind: Lab
    shortNames:
      - lab
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: false
          x-kubernetes-validations:
            - rule: self.metadata.name == self.spec.labId
              message: metadata.name must equal spec.labId
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
              x-kubernetes-preserve-unknown-fields: false
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: false
              additionalProperties: false
              x-kubernetes-validations:
                - rule: self.labId == oldSelf.labId
                  message: labId is immutable
                - rule: self.hermesImage == oldSelf.hermesImage
                  message: hermesImage is immutable
                - rule: self.skillsImage == oldSelf.skillsImage
                  message: skillsImage is immutable
              required:
                - labId
                - hermesImage
                - skillsImage
                - pvcSize
                - resources
                - secretRefs
              properties:
                labId:
                  type: string
                  maxLength: 40
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                hermesImage:
                  type: string
                  pattern: '^.+@sha256:[0-9a-f]{64}$'
                skillsImage:
                  type: string
                  pattern: '^.+@sha256:[0-9a-f]{64}$'
                pvcSize:
                  type: string
                  minLength: 1
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: false
                  additionalProperties: false
                  required:
                    - requests
                    - limits
                  properties:
                    requests:
                      type: object
                      x-kubernetes-preserve-unknown-fields: false
                      additionalProperties: false
                      required: [cpu, memory]
                      properties:
                        cpu: {type: string, minLength: 1}
                        memory: {type: string, minLength: 1}
                    limits:
                      type: object
                      x-kubernetes-preserve-unknown-fields: false
                      additionalProperties: false
                      required: [cpu, memory]
                      properties:
                        cpu: {type: string, minLength: 1}
                        memory: {type: string, minLength: 1}
                secretRefs:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: false
                    additionalProperties: false
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
