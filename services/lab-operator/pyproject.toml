[project]
name = "scilab-lab-operator"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kopf>=1.44,<2",
    "kubernetes>=36,<37",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_operator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
